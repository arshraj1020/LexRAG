spring:
  application:
    name: lexrag-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lexrag}
    username: ${DATABASE_USERNAME:lexrag}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
      timeout: 2000ms

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE_MB:50}MB
      max-request-size: ${MAX_FILE_SIZE_MB:50}MB

  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# ── Actuator ───────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# ── Security ───────────────────────────────────────────────
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

# ── AI Service ─────────────────────────────────────────────
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8001}
    internal-api-key: ${INTERNAL_API_KEY}
    connect-timeout-seconds: 10
    read-timeout-seconds: 120

# ── File Upload ────────────────────────────────────────────
upload:
  directory: ${UPLOAD_DIR:/app/uploads}
  allowed-content-types:
    - application/pdf
  max-file-size-mb: ${MAX_FILE_SIZE_MB:50}

# ── OpenAPI ────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ── Logging ────────────────────────────────────────────────
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.lexrag: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
